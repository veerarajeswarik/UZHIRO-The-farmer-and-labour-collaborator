# Render Blueprint for the UZHIRO backend API (Express + MongoDB Atlas).
# Render > New > Blueprint > pick this repo. Values marked `sync: false`
# are entered in the Render dashboard and are never stored in git.
services:
  - type: web
    name: uzhiro-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: JWT_EXPIRES_IN
        value: 7d
      # Long random secret generated by Render (changing it logs everyone out).
      - key: JWT_SECRET
        generateValue: true
      # mongodb+srv://<user>:<password>@<cluster>/uzhiro  (MongoDB Atlas)
      - key: MONGODB_URI
        sync: false
      # Your Netlify site URL(s), comma-separated, no trailing slash,
      # e.g. https://uzhiro.netlify.app
      - key: CLIENT_URL
        sync: false
      # Optional - AI assistant / crop explanations (console.anthropic.com).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional - live mandi prices (data.gov.in).
      - key: AGMARKNET_API_KEY
        sync: false
