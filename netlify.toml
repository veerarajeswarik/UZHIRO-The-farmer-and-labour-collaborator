# Netlify config for the UZHIRO frontend (React + Vite SPA).
# The backend API runs separately (see render.yaml) - set VITE_API_URL in
# Netlify > Site configuration > Environment variables, e.g.
#   VITE_API_URL = https://uzhiro-api.onrender.com/api
# VITE_* values are bundled into public JavaScript: never put secrets in them.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Client-side routing: serve index.html for every app route so refreshing
# /dashboard, /labourers/123, etc. doesn't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Vite fingerprints asset filenames, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
